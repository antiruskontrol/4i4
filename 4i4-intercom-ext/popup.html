<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>4і4 Studio Intercom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    body { width: 420px; min-height: 520px; background: #080e1c; color: #e2e8f0; padding: 14px; }
    .top { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(56, 189, 248, 0.25); }
    .brand { font-weight: 700; color: #38bdf8; font-size: 14px; margin-right: auto; }
    select, input { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.35); color: #f8fafc; border-radius: 999px; padding: 6px 12px; font-size: 12px; outline: none; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; align-items: stretch; }
    .tab-drop-wrap { position: relative; flex: 1; display: flex; }
    .tab-drop-wrap > .tab { width: 100%; }
    .clients-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 250px;
      max-height: 240px;
      overflow-y: auto;
      background: #0b132b;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
      z-index: 999;
      padding: 4px;
    }
    .tab-drop-wrap:hover .clients-dropdown { display: block; }
    .client-dd-item {
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .client-dd-item:hover { background: rgba(56, 189, 248, 0.22); color: #fff; }
    .client-dd-item.active { background: rgba(16, 185, 129, 0.22); border: 1px solid rgba(16, 185, 129, 0.45); color: #10b981; font-weight: 600; }
    .tab { flex: 1; padding: 7px 8px; border-radius: 999px; border: 1px solid rgba(56, 189, 248, 0.3); background: rgba(15, 23, 42, 0.75); color: #94a3b8; font-size: 12px; cursor: pointer; text-align: center; }
    .tab.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-color: #38bdf8; }
    .pane { display: none; }
    .pane.active { display: block; }
    .card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.22); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(56, 189, 248, 0.18); }
    .dialog-tools { display: flex; gap: 4px; }
    .icon-btn { width: 28px; height: 28px; border-radius: 999px; border: 1px solid rgba(56, 189, 248, 0.35); background: rgba(15, 23, 42, 0.9); color: #e0f2fe; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.15s; }
    .icon-btn:hover { background: #0284c7; border-color: #38bdf8; transform: translateY(-1px); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .btn { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(56, 189, 248, 0.45); background: rgba(2, 132, 199, 0.25); color: #e0f2fe; font-size: 11px; cursor: pointer; }
    .btn:hover { background: #0284c7; color: #fff; }
    .msgs { height: 220px; overflow-y: auto; background: rgba(2, 6, 23, 0.65); border-radius: 12px; padding: 8px; margin-top: 8px; font-size: 11px; }
    .msg { margin-bottom: 6px; line-height: 1.4; }
    .msg.staff { color: #38bdf8; }
    .msg-author { color: #10b981; font-weight: 600; }
    label { display: block; font-size: 11px; color: #94a3b8; margin: 8px 0 4px; }
  </style>
  <script src="peerjs.min.js"></script>
</head>
<body>
  <div class="top">
    <div class="brand">4і4 INTERCOM</div>
    <select id="staff-select">
      <option value="staff_01">staff_01</option>
      <option value="staff_02">staff_02</option>
      <option value="staff_03">staff_03</option>
    </select>
    <select id="status-select">
      <option value="online">🟢 В мережі</option>
      <option value="busy">🔴 Зайнятий</option>
      <option value="offline">⚫ Офлайн</option>
    </select>
  </div>
  <div class="tabs">
    <div class="tab-drop-wrap">
      <button class="tab active" data-t="clients">Клієнти ▾</button>
      <div id="clients-dropdown" class="clients-dropdown"></div>
    </div>
    <button class="tab" data-t="team">Команда (Intercom)</button>
    <button class="tab" data-t="cfg">Налаштування</button>
  </div>
  <div id="pane-clients" class="pane active"><div id="sessions-box"></div></div>
  <div id="pane-team" class="pane"><div id="team-box"></div><audio id="team-audio" autoplay></audio></div>
  <div id="pane-cfg" class="pane">
    <label>Ваше ім'я (для чату та меню)</label><input id="staff-name" style="width:100%;" placeholder="Напр. Олена">
    <label>SUPABASE_URL</label><input id="sb-url" style="width:100%;" placeholder="https://supabase.co">
    <label>SUPABASE_ANON_KEY</label><input id="sb-key" style="width:100%;" placeholder="sb_publishable_...">
    <div class="row" style="margin-top:12px;"><button id="save-cfg" class="btn" style="width:100%;">Зберегти ключі</button></div>
    <div id="cfg-info" style="font-size:11px; color:#38bdf8; margin-top:8px;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
