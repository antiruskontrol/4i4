<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Марія Примаченко — Виставкова зала | Чагарники і Чорнобривці</title>
  <style>
    :root { --bg: #070709; --gold: #d4af37; --glow: rgba(212,175,55,0.65); --txt: #f4f1ea; --mut: #a8a399; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    header {
      position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
      padding: 20px 6%; background: rgba(7,7,9,0.88); border-bottom: 1px solid rgba(212,175,55,0.18); backdrop-filter: blur(10px);
    }
    .brand { font-size: 1.05rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
    .nav-btn {
      background: transparent; color: var(--txt); border: 1px solid rgba(212,175,55,0.45);
      padding: 9px 20px; font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none; border-radius: 4px; transition: all 0.3s;
    }
    .nav-btn:hover { border-color: var(--gold); color: #fff; box-shadow: 0 0 18px var(--glow), inset 0 0 8px rgba(212,175,55,0.25); }
    main { max-width: 1360px; margin: 0 auto; padding: 48px 6% 90px; }
    .hall-header { text-align: center; margin-bottom: 48px; }
    .hall-header h1 { font-size: clamp(2rem,4vw,3.2rem); font-weight: 300; color: var(--gold); margin-bottom: 10px; }
    .hall-header p { color: var(--mut); font-size: 1.05rem; max-width: 680px; margin: 0 auto; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
    .item {
      position: relative; background: #111116; border: 1px solid rgba(212,175,55,0.22); border-radius: 6px;
      overflow: hidden; cursor: pointer; aspect-ratio: 4/3; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .item:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 10px 26px rgba(0,0,0,0.7), 0 0 18px rgba(212,175,55,0.35); }
    .item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.45s; }
    .item:hover img { transform: scale(1.04); }
    .caption {
      position: absolute; inset: auto 0 0 0; padding: 12px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.88), transparent); color: var(--gold); font-size: 0.9rem;
    }
    .lightbox {
      position: fixed; inset: 0; background: rgba(4,4,6,0.96); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 24px; user-select: none;
    }
    .lightbox.open { display: flex; }
    .lb-box { position: relative; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; align-items: center; }
    .lb-box img { max-width: 100%; max-height: 78vh; object-fit: contain; border: 1px solid rgba(212,175,55,0.4); border-radius: 4px; }
    .lb-count { margin-top: 16px; color: var(--gold); font-size: 1rem; letter-spacing: 0.1em; }
    .lb-btn {
      position: fixed; background: rgba(15,15,20,0.75); color: var(--gold); border: 1px solid rgba(212,175,55,0.45);
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.25s; z-index: 1010; border-radius: 50%;
    }
    .lb-btn:hover { background: var(--gold); color: var(--bg); box-shadow: 0 0 20px var(--glow); }
    .lb-close { top: 24px; right: 28px; width: 44px; height: 44px; font-size: 1.5rem; }
    .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); width: 52px; height: 52px; font-size: 1.6rem; }
    .lb-prev { left: 24px; }
    .lb-next { right: 24px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Чагарники і Чорнобривці</div>
    <a href="exhibitions.html" class="nav-btn">← До виставок</a>
  </header>
  <main>
    <div class="hall-header">
      <h1>Марія Примаченко</h1>
      <p>Експозиція вибраних робіт майстрині українського народного декоративного живопису (10 полотен).</p>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <div id="lb" class="lightbox" role="dialog">
    <button id="lb-close" class="lb-btn lb-close">&times;</button>
    <button id="lb-prev" class="lb-btn lb-prev">&#10094;</button>
    <div class="lb-box"><img id="lb-img" src="" alt=""><div id="lb-count" class="lb-count"></div></div>
    <button id="lb-next" class="lb-btn lb-next">&#10095;</button>
  </div>
  <script src="gallery-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('grid'), lb = document.getElementById('lb');
      const img = document.getElementById('lb-img'), cnt = document.getElementById('lb-count');
      const cfg = (typeof EXHIBITIONS_DATA !== 'undefined') ? EXHIBITIONS_DATA.find(x => x.id === 'prymachenko') : null;
      const folder = cfg ? cfg.folder : 'images/prymachenko', total = cfg ? cfg.artworksCount : 10;
      const list = Array.from({length: total}, (_, i) => `${folder}/${i + 1}.webp`);
      let idx = 0;

      list.forEach((src, i) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<img src="${src}" alt="Робота №${i + 1}" loading="lazy"><div class="caption">Експонат №${i + 1}</div>`;
        div.onclick = () => { idx = i; upd(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; };
        grid.appendChild(div);
      });

      const upd = () => { img.src = list[idx]; cnt.textContent = `Картина ${idx + 1} з ${list.length}`; };
      const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
      const prev = () => { idx = (idx - 1 + list.length) % list.length; upd(); };
      const next = () => { idx = (idx + 1) % list.length; upd(); };

      document.getElementById('lb-close').onclick = close;
      document.getElementById('lb-prev').onclick = e => { e.stopPropagation(); prev(); };
      document.getElementById('lb-next').onclick = e => { e.stopPropagation(); next(); };
      lb.onclick = e => { if (e.target === lb) close(); };
      document.onkeydown = e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      };
    });
  </script>
</body>
</html>
