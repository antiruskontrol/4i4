<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtWeb Studio | Візитівка</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #intro-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        #poster-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; z-index: 1; background-color: #000;
            overflow: hidden;
        }

        /* Оновлено шлях до картинки */
        #poster-img {
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center;
        }

        #text-block { 
            position: relative; z-index: 10; text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
        }

        /* Рядок 1: ArtWeb (Об'єднане слово) */
        .line-1-wrapper {
            font-size: 4rem; font-weight: 700; letter-spacing: 0px; opacity: 0; 
            display: flex; justify-content: center; align-items: center;
            position: relative; 
            padding: 10px;
            background-image: linear-gradient(120deg, #ff8c00 0%, #ff8c00 30%, #ffffff 50%, #00bfff 70%, #00bfff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transform: scale(0.5); /* Для ефекту "виринання" */
        }

        .run-shine {
            animation: shine-effect 3s ease-in-out forwards;
        }

        @keyframes shine-effect {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* Рядок 2: © Studio */
        .line-2 { font-size: 1.5rem; color: #ccc; opacity: 0; display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing: 5px; height: 2rem; }
        .copyright-symbol { font-size: 2rem; display: inline-block; transform: scale(0); }

        /* Рядок 3: ЧіЧ */
        .line-3 { 
            font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; 
            color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); 
            opacity: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 4rem; 
            white-space: nowrap; 
        }
        
        .char { display: inline-block; }

        #hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5); font-size: 1rem; z-index: 20;
            opacity: 0; transition: opacity 1s; letter-spacing: 2px; cursor: pointer;
        }

        @media (max-width: 768px) {
            .line-1-wrapper { font-size: 2.5rem; }
            .line-3 { font-size: 1.5rem; }
            .line-2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <div id="poster-bg">
            <!-- НОВИЙ ШИРОКИЙ ПОСТЕР -->
            <img id="poster-img" src="poster.png" alt="Poster">
        </div>

        <div id="text-block">
            <div class="line-1-wrapper" id="row1">
                ArtWeb
            </div>
            
            <div class="line-2" id="row2">
                <span class="copyright-symbol" id="copySymbol">©</span>
                <span id="studioWord" style="opacity:0; transform: translateY(20px);">Studio</span>
            </div>
            
            <div class="line-3" id="row3">
                <span id="chichText"></span>
            </div>
        </div>
        
        <div id="hint">Натисніть, щоб увійти до студії</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            const chichContainer = document.getElementById("chichText");
            
            const ch1 = document.createElement("span"); ch1.className = "char"; ch1.textContent = "Ч";
            const restLeft = document.createElement("span"); restLeft.className = "char"; restLeft.textContent = "агарники"; 
            const spaceAndI = document.createElement("span"); spaceAndI.className = "char"; spaceAndI.textContent = "\u00A0і\u00A0"; 
            const ch2 = document.createElement("span"); ch2.className = "char"; ch2.textContent = "Ч";
            const restRight = document.createElement("span"); restRight.className = "char"; restRight.textContent = "орнобривці";

            chichContainer.appendChild(ch1);
            chichContainer.appendChild(restLeft);
            chichContainer.appendChild(spaceAndI);
            chichContainer.appendChild(ch2);
            chichContainer.appendChild(restRight);
            
            gsap.set([restLeft, restRight], { opacity: 0, width: 0, display: "inline-block", overflow: "hidden" });

            const tl = gsap.timeline({
                onComplete: () => {
                    document.getElementById("hint").style.opacity = "1";
                }
            });

            // 1. Поява ArtWeb
            tl.to(".line-1-wrapper", { duration: 1.8, opacity: 1, scale: 1, ease: "power3.out" })
            
            // 2. Градієнт
            .add(() => { document.getElementById("row1").classList.add("run-shine"); }, "-=0.8")
            .to({}, { duration: 2.5 })
            
            // 3. Підняття ArtWeb + поява © (м'яка пружина)
            .to(".line-1-wrapper", { duration: 1.2, y: -50, ease: "back.out(1.2)" }, "-=0.5")
            .to(".copyright-symbol", { duration: 0.8, opacity: 1, scale: 1, ease: "power3.out" }, "-=0.7")
            
            // 4. Поява Studio
            .to(".line-2", { duration: 0.1, opacity: 1 }, "-=0.5")
            .fromTo("#studioWord", 
                { opacity: 0, y: 20, scale: 0.9 }, 
                { duration: 1.2, opacity: 1, y: 0, scale: 1, ease: "power3.out" }, 
                "-=0.8"
            )
            
            // 5. Підняття рядка 2
            .to(".line-2", { duration: 1, y: -30, ease: "back.out(1.2)" }, "-=0.4")
            
            // 6. Поява початкового "ЧіЧ"
            .to(".line-3", { duration: 0.1, opacity: 1 }, "-=0.5")
            .from([ch1, spaceAndI, ch2], { duration: 1, opacity: 0, y: 30, stagger: 0.15, ease: "power4.out" }, "-=0.6")
            
            // 7. Розгортання тексту
            .to(restLeft, { width: "auto", opacity: 1, duration: 1.8, ease: "power3.inOut" }, "-=0.2")
            .to(restRight, { width: "auto", opacity: 1, duration: 1.8, ease: "power3.inOut" }, "<")

            // 8. Підняття рядка 3
            .to(".line-3", { duration: 1, y: -40, ease: "back.out(1.2)" }, "-=0.6")
            
            // 9. ЗУМАУТ ПОСТЕРА (Оскільки картинка широка, зменшуємо початковий масштаб до 1.2)
            .to("#poster-bg", { duration: 0.8, opacity: 1, ease: "power2.inOut" }, "-=0.4")
            .fromTo("#poster-img", 
                { scale: 1.2, objectFit: "cover" }, 
                { scale: 1, objectFit: "contain", duration: 4.5, ease: "power3.inOut" }, 
                "-=0.8"
            )
            
            // 10. Текст стає на фінальні місця
            .to("#text-block", { duration: 2, scale: 0.7, y: -70, ease: "power3.inOut" }, "-=4.2");
            
            // Логіка переходу
            function goToCopilot() {
                gsap.to("body", { opacity: 0, duration: 1, onComplete: () => {
                    window.location.href = 'copilot.html'; 
                }});
            }
            document.getElementById("hint").addEventListener("click", goToCopilot);
            document.getElementById("poster-bg").addEventListener("click", goToCopilot);
        });
    </script>
</body>
</html>
