<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtWeb Studio | Візитівка</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #intro-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Контейнер для постера */
        #poster-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; z-index: 1; background-color: #000;
            overflow: hidden;
        }

        /* Сама картинка постера */
        #poster-img {
            width: 100%; height: 100%;
            object-fit: cover; /* Початковий стан - заповнює екран */
            transform-origin: center center;
        }

        /* Контейнер для тексту */
        #text-block { 
            position: relative; z-index: 10; text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
        }

        /* Рядок 1: ArtWeb */
        .line-1 { 
            font-size: 4rem; font-weight: 700; letter-spacing: 2px; opacity: 0; 
            display: flex; justify-content: center; align-items: center; gap: 15px;
            position: relative; overflow: hidden; 
            padding: 10px;
        }
        .art-text { color: #ff8c00; text-shadow: 0 0 10px rgba(255, 140, 0, 0.5); }
        .web-text { color: #00bfff; text-shadow: 0 0 10px rgba(0, 191, 255, 0.5); }
        
        /* ОДИН суцільний градієнт для всього рядка */
        .shine-global { 
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%; 
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); 
            transform: skewX(-25deg); 
        }

        /* Рядок 2: © Studio */
        .line-2 { font-size: 1.5rem; color: #ccc; opacity: 0; display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing: 5px; height: 2rem; }
        .copyright-symbol { font-size: 2rem; display: inline-block; transform: scale(0); }

        /* Рядок 3: ЧіЧ -> Чагарники і Чорнобривці */
        .line-3 { 
            font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; 
            color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); 
            opacity: 0; display: flex; justify-content: center; min-height: 4rem; 
        }
        
        /* Літери, які будуть з'являтися між "Ч" і "ці" */
        .letter-new { 
            display: inline-block; opacity: 0; width: 0; overflow: hidden; 
            vertical-align: bottom; white-space: pre;
        }

        @media (max-width: 768px) {
            .line-1 { font-size: 2.5rem; flex-direction: column; gap: 0; }
            .line-3 { font-size: 1.5rem; }
            .line-2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <!-- Постер -->
        <div id="poster-bg">
            <!-- ВКАЖІТЬ ВАШУ НАЗВУ ФАЙЛУ ТУТ -->
            <img id="poster-img" src="4і4.jfif" alt="Poster">
        </div>

        <!-- Текст -->
        <div id="text-block">
            <div class="line-1" id="row1">
                <span class="art-text" id="artWord">Art</span>
                <span class="web-text" id="webWord">Web</span>
                <span class="shine-global"></span>
            </div>
            
            <div class="line-2" id="row2">
                <span class="copyright-symbol" id="copySymbol">©</span>
                <span id="studioWord" style="opacity:0;">Studio</span>
            </div>
            
            <div class="line-3" id="row3">
                <span id="chichText" style="display: flex;"></span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // Підготовка літер для "Чагарники і Чорнобривці"
            const chichContainer = document.getElementById("chichText");
            
            const firstChar = document.createElement("span");
            firstChar.textContent = "Ч";
            firstChar.style.opacity = "0";
            
            const newLetters = document.createElement("span");
            newLetters.className = "letter-new";
            newLetters.textContent = "агарники і Чорнобрив";
            
            const lastChar = document.createElement("span");
            lastChar.textContent = "ці";
            lastChar.style.opacity = "0";

            chichContainer.appendChild(firstChar);
            chichContainer.appendChild(newLetters);
            chichContainer.appendChild(lastChar);

            const tl = gsap.timeline({
                onComplete: () => {
                    setTimeout(() => {
                        gsap.to("body", { opacity: 0, duration: 1, onComplete: () => {
                            window.location.href = 'copilot.html'; 
                        }});
                    }, 2500); // Час на постері перед переходом
                }
            });

            // КРОК 1: Поява ArtWeb
            tl.to(".line-1", { duration: 1.5, opacity: 1, ease: "power2.out" })
            
            // КРОК 2: ПОВІЛЬНИЙ суцільний градієнт (2 секунди)
            .to(".shine-global", { duration: 2, left: "150%", ease: "power1.inOut" })
            
            // КРОК 3: Підняття ArtWeb і поява ©
            .to(".line-1", { duration: 0.5, y: -50, ease: "power2.inOut" }, "+=0.2")
            .to(".copyright-symbol", { duration: 0.8, opacity: 1, scale: 1, ease: "back.out(2)" }, "-=0.5")
            
            // КРОК 4: Поява Studio
            .to(".line-2", { duration: 0.1, opacity: 1 }, "+=0.3")
            .to("#studioWord", { duration: 1, opacity: 1, ease: "power2.out" })
            
            // КРОК 5: Підняття рядка 2
            .to(".line-2", { duration: 0.5, y: -30, ease: "power2.inOut" }, "+=0.5")
            
            // КРОК 6: Поява першої "Ч"
            .to("#chichText", { duration: 0.1, opacity: 1 })
            .to(firstChar, { duration: 0.5, opacity: 1, ease: "power2.out" })
            
            // КРОК 7: Розгортання слова (літери роз'їжджаються)
            .to(newLetters, { 
                duration: 1.5, 
                width: "auto", 
                opacity: 1, 
                ease: "power2.inOut" 
            }, "+=0.5")
            .to(lastChar, { duration: 0.5, opacity: 1 }, "-=0.5")

            // КРОК 8: Підняття рядка 3
            .to(".line-3", { duration: 0.5, y: -20, ease: "power2.inOut" }, "+=0.5")
            
            // КРОК 9: ЗУМАУТ ПОСТЕРА (Використовуємо новий підхід)
            .to("#poster-bg", { duration: 0.5, opacity: 1 })
            
            // Картинка плавно зменшується, а потім змінює масштаб
            .fromTo("#poster-img", 
                { scale: 1.5, objectFit: "cover" }, 
                { scale: 1, objectFit: "contain", duration: 3.5, ease: "power2.inOut" }, 
                "-=0.5"
            )
            
            // КРОК 10: Текст стає на свої місця (вгору, на постер)
            .to("#text-block", { duration: 1.5, scale: 0.7, y: -50, ease: "power2.inOut" }, "-=3");
        });
    </script>
</body>
</html>
