<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtWeb Studio | Візитівка</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #intro-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Контейнер для постера */
        #poster-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; z-index: 1; background-color: #000;
            overflow: hidden;
        }

        #poster-img {
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center;
        }

        /* Контейнер для тексту */
        #text-block { 
            position: relative; z-index: 10; text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
        }

        /* Рядок 1: ArtWeb */
        .line-1 { 
            font-size: 4rem; font-weight: 700; letter-spacing: 2px; opacity: 0; 
            display: flex; justify-content: center; align-items: center; gap: 15px;
            position: relative; 
            padding: 10px;
        }
        
        /* ПРАВКА 1: Градієнт проходить крізь літери */
        .art-text, .web-text {
            position: relative;
        }
        
        .art-text {
            color: transparent;
            background-image: linear-gradient(to right, #ff8c00, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            background-size: 200% auto;
            animation: shine 3s linear infinite; /* Це буде замінено GSAP для синхронізації */
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        .web-text {
            color: transparent;
            background-image: linear-gradient(to right, #00bfff, #00ffff, #00bfff);
            -webkit-background-clip: text;
            background-clip: text;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        /* Ефект світла (буде запускатися через GSAP для синхронізації) */
        .shine-global { display: none; /* Старий контейнер більше не потрібен */ }

        /* Рядок 2: © Studio */
        .line-2 { font-size: 1.5rem; color: #ccc; opacity: 0; display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing: 5px; height: 2rem; }
        .copyright-symbol { font-size: 2rem; display: inline-block; transform: scale(0); }

        /* Рядок 3: ЧіЧ -> Чагарники і Чорнобривці */
        .line-3 { 
            font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; 
            color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); 
            opacity: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 4rem; 
            white-space: nowrap; 
        }
        
        .char { display: inline-block; }

        @media (max-width: 768px) {
            .line-1 { font-size: 2.5rem; flex-direction: column; gap: 0; }
            .line-3 { font-size: 1.5rem; }
            .line-2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <div id="poster-bg">
            <img id="poster-img" src="4і4.jfif" alt="Poster">
        </div>

        <div id="text-block">
            <div class="line-1" id="row1">
                <!-- Обгортки для градієнта -->
                <div style="overflow: hidden;">
                    <span class="art-text" id="artWord">Art</span>
                </div>
                <div style="overflow: hidden;">
                    <span class="web-text" id="webWord">Web</span>
                </div>
            </div>
            
            <div class="line-2" id="row2">
                <span class="copyright-symbol" id="copySymbol">©</span>
                <span id="studioWord" style="opacity:0;">Studio</span>
            </div>
            
            <div class="line-3" id="row3">
                <span id="chichText"></span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // ПРАВКА 2: Розліт літер для "ЧіЧ"
            const chichContainer = document.getElementById("chichText");
            
            // Створюємо літери для "ЧіЧ"
            const ch1 = document.createElement("span"); ch1.className = "char"; ch1.textContent = "Ч";
            const i1 = document.createElement("span"); i1.className = "char"; i1.textContent = "і";
            const ch2 = document.createElement("span"); ch2.className = "char"; ch2.textContent = "Ч";
            
            // Літери, які будуть з'являтися в процесі (приховані)
            const restLeft = document.createElement("span"); restLeft.className = "char"; restLeft.textContent = "агарники ";
            const restRight = document.createElement("span"); restRight.className = "char"; restRight.textContent = "орнобривці";

            // Збираємо початковий стан: Ч і Ч видимі, решта прихована
            chichContainer.appendChild(ch1);
            chichContainer.appendChild(restLeft);
            chichContainer.appendChild(i1);
            chichContainer.appendChild(restRight);
            chichContainer.appendChild(ch2);

            // Ховаємо нові літери
            gsap.set([restLeft, restRight], { opacity: 0, width: 0, overflow: "hidden", display: "inline-block" });

            const tl = gsap.timeline({
                onComplete: () => {
                    setTimeout(() => {
                        gsap.to("body", { opacity: 0, duration: 1, onComplete: () => {
                            window.location.href = 'copilot.html'; 
                        }});
                    }, 2500); 
                }
            });

            // КРОК 1: Поява ArtWeb (з кривою)
            tl.to(".line-1", { duration: 1.5, opacity: 1, ease: "power4.out" })
            
            // КРОК 2: ПРАВКА 1: Градієнт (імітація пробігу по літерах)
            // Використовуємо background-position для анімації
            .fromTo(".art-text", { backgroundPosition: "200% center" }, { backgroundPosition: "-200% center", duration: 2, ease: "power2.inOut" }, "-=0.5")
            .fromTo(".web-text", { backgroundPosition: "200% center" }, { backgroundPosition: "-200% center", duration: 2, ease: "power2.inOut" }, "<")
            
            // КРОК 3: Підняття ArtWeb і поява © (з кривою)
            .to(".line-1", { duration: 0.5, y: -50, ease: "back.out(1.7)" }, "+=0.2")
            .to(".copyright-symbol", { duration: 0.8, opacity: 1, scale: 1, ease: "back.out(2)" }, "-=0.5")
            
            // КРОК 4: Поява Studio
            .to(".line-2", { duration: 0.1, opacity: 1 }, "+=0.3")
            .to("#studioWord", { duration: 1, opacity: 1, ease: "power3.out" })
            
            // КРОК 5: Підняття рядка 2
            .to(".line-2", { duration: 0.5, y: -30, ease: "back.out(1.5)" }, "+=0.5")
            
            // КРОК 6: Поява "ЧіЧ" (літери з'являються)
            .to(".line-3", { duration: 0.1, opacity: 1 })
            .from([ch1, i1, ch2], { duration: 0.8, opacity: 0, y: 20, stagger: 0.2, ease: "back.out(1.7)" })
            
            // КРОК 7: ПРАВКА 2: Розліт (ЧіЧ розсувається, відкриваючи середину)
            // Анімуємо ширину прихованих літер, щоб вони розсунули "Ч" і "Ч"
            .to(restLeft, { width: "auto", opacity: 1, duration: 1.5, ease: "power4.inOut" }, "+=0.5")
            .to(restRight, { width: "auto", opacity: 1, duration: 1.5, ease: "power4.inOut" }, "<")

            // КРОК 8: Підняття рядка 3
            .to(".line-3", { duration: 0.5, y: -20, ease: "back.out(1.5)" }, "+=0.5")
            
            // КРОК 9: ЗУМАУТ ПОСТЕРА
            .to("#poster-bg", { duration: 0.5, opacity: 1 })
            
            // ПРАВКА 3: Зміна масштабу 2.5 з нелінійною кривою (power4.inOut - дуже плавна)
            .fromTo("#poster-img", 
                { scale: 2.5, objectFit: "cover" }, 
                { scale: 1, objectFit: "contain", duration: 4, ease: "power4.inOut" }, 
                "-=0.5"
            )
            
            // КРОК 10: Текст стає на свої місця
            .to("#text-block", { duration: 1.5, scale: 0.7, y: -50, ease: "power4.inOut" }, "-=3.5");
        });
    </script>
</body>
</html>
