<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtWeb Studio | Візитівка</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #intro-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Контейнер для постера */
        #poster-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; z-index: 1; background-color: #000;
            overflow: hidden;
        }

        /* Сама картинка постера */
        #poster-img {
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center;
            /* Початковий масштаб задається в JS */
        }

        /* Контейнер для тексту */
        #text-block { 
            position: relative; z-index: 10; text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
        }

        /* Рядок 1: ArtWeb */
        .line-1 { 
            font-size: 4rem; font-weight: 700; letter-spacing: 2px; opacity: 0; 
            display: flex; justify-content: center; align-items: center; gap: 15px;
            position: relative; 
            /* Прибираємо overflow: hidden, щоб не було видно рамок */
            padding: 10px;
        }
        .art-text { color: #ff8c00; text-shadow: 0 0 10px rgba(255, 140, 0, 0.5); }
        .web-text { color: #00bfff; text-shadow: 0 0 10px rgba(0, 191, 255, 0.5); }
        
        /* ПРАВКА 2: Градієнт з м'якими краями (без видимого контейнера) */
        .shine-global { 
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%; 
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%); 
            transform: skewX(-25deg); 
            /* Маска робить краї градієнта розмитими */
            -webkit-mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            pointer-events: none; /* Щоб не заважав клікам */
        }

        /* Рядок 2: © Studio */
        .line-2 { font-size: 1.5rem; color: #ccc; opacity: 0; display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing: 5px; height: 2rem; }
        .copyright-symbol { font-size: 2rem; display: inline-block; transform: scale(0); }

        /* Рядок 3: ЧіЧ -> Чагарники і Чорнобривці */
        .line-3 { 
            font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; 
            color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); 
            opacity: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 4rem; 
            white-space: nowrap; /* Щоб текст не переносився на новий рядок */
        }
        
        /* Стилі для літер */
        .char { display: inline-block; }

        @media (max-width: 768px) {
            .line-1 { font-size: 2.5rem; flex-direction: column; gap: 0; }
            .line-3 { font-size: 1.5rem; }
            .line-2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <div id="poster-bg">
            <!-- ВКАЖІТЬ ВАШУ НАЗВУ ФАЙЛУ ТУТ -->
            <img id="poster-img" src="4і4.jfif" alt="Poster">
        </div>

        <div id="text-block">
            <div class="line-1" id="row1">
                <span class="art-text" id="artWord">Art</span>
                <span class="web-text" id="webWord">Web</span>
                <span class="shine-global"></span>
            </div>
            
            <div class="line-2" id="row2">
                <span class="copyright-symbol" id="copySymbol">©</span>
                <span id="studioWord" style="opacity:0;">Studio</span>
            </div>
            
            <!-- ПРАВКА 3: Контейнер для ЧіЧ, який буде наповнюватися скриптом -->
            <div class="line-3" id="row3">
                <span id="chichText"></span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // ПРАВКА 3: Динамічно створюємо структуру для розгортання
            const chichContainer = document.getElementById("chichText");
            
            // Створюємо літеру "Ч" (початкову)
            const firstChar = document.createElement("span");
            firstChar.className = "char";
            firstChar.textContent = "Ч";
            firstChar.style.opacity = "0";
            
            // Створюємо контейнер для середини (який спочатку стиснутий)
            const middlePart = document.createElement("span");
            middlePart.className = "char";
            middlePart.textContent = "агарники і Чорнобрив";
            middlePart.style.display = "inline-block";
            middlePart.style.opacity = "0";
            middlePart.style.width = "0px"; // Початкова ширина 0
            
            // Створюємо літеру "ці" (кінцеву)
            const lastChar = document.createElement("span");
            lastChar.className = "char";
            lastChar.textContent = "ці";
            lastChar.style.opacity = "0";

            // Збираємо все докупи
            chichContainer.appendChild(firstChar);
            chichContainer.appendChild(middlePart);
            chichContainer.appendChild(lastChar);

            const tl = gsap.timeline({
                onComplete: () => {
                    setTimeout(() => {
                        gsap.to("body", { opacity: 0, duration: 1, onComplete: () => {
                            window.location.href = 'copilot.html'; 
                        }});
                    }, 2500); 
                }
            });

            // КРОК 1: Поява ArtWeb
            tl.to(".line-1", { duration: 1.5, opacity: 1, ease: "power2.out" })
            
            // КРОК 2: ПОВІЛЬНИЙ суцільний градієнт (2 секунди)
            .to(".shine-global", { duration: 2, left: "150%", ease: "power1.inOut" })
            
            // КРОК 3: Підняття ArtWeb і поява ©
            .to(".line-1", { duration: 0.5, y: -50, ease: "power2.inOut" }, "+=0.2")
            .to(".copyright-symbol", { duration: 0.8, opacity: 1, scale: 1, ease: "back.out(2)" }, "-=0.5")
            
            // КРОК 4: Поява Studio
            .to(".line-2", { duration: 0.1, opacity: 1 }, "+=0.3")
            .to("#studioWord", { duration: 1, opacity: 1, ease: "power2.out" })
            
            // КРОК 5: Підняття рядка 2
            .to(".line-2", { duration: 0.5, y: -30, ease: "power2.inOut" }, "+=0.5")
            
            // КРОК 6: Поява "ЧіЧ" (спочатку тільки перша літера, але контейнер стає видимим)
            .to(".line-3", { duration: 0.5, opacity: 1 })
            .to(firstChar, { duration: 0.5, opacity: 1, ease: "power2.out" })
            
            // КРОК 7: Розгортання (літери розсуваються)
            .to(middlePart, { 
                duration: 1.5, 
                width: "auto", // GSAP тепер знає, як рахувати це, бо батько має white-space: nowrap
                opacity: 1, 
                ease: "power2.inOut" 
            }, "+=0.5")
            .to(lastChar, { duration: 0.5, opacity: 1 }, "-=0.5")

            // КРОК 8: Підняття рядка 3
            .to(".line-3", { duration: 0.5, y: -20, ease: "power2.inOut" }, "+=0.5")
            
            // КРОК 9: ЗУМАУТ ПОСТЕРА
            .to("#poster-bg", { duration: 0.5, opacity: 1 })
            
            // ПРАВКА 1: Початковий масштаб 2.5, плавне зменшення до 1
            .fromTo("#poster-img", 
                { scale: 2.5, objectFit: "cover" }, // Збільшено до 2.5!
                { scale: 1, objectFit: "contain", duration: 4, ease: "power2.inOut" }, // Трохи збільшив тривалість для плавності
                "-=0.5"
            )
            
            // КРОК 10: Текст стає на свої місця
            .to("#text-block", { duration: 1.5, scale: 0.7, y: -50, ease: "power2.inOut" }, "-=3.5");
        });
    </script>
</body>
</html>
