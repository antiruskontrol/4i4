<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виставки — Чагарники і Чорнобривці</title>
  <style>
    :root { --bg: #070709; --gold: #d4af37; --glow: rgba(212,175,55,0.65); --txt: #f4f1ea; --mut: #a8a399; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .wreath-bg {
      position: fixed; top: 50%; right: -8%; transform: translateY(-50%);
      width: 65vw; max-width: 900px; height: 65vw; max-height: 900px;
      background: url('groundexhib.webp') right center / contain no-repeat;
      mix-blend-mode: screen; opacity: 0.28; pointer-events: none; z-index: 0;
    }
    header {
      position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center;
      padding: 24px 6%; border-bottom: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(6px);
    }
    .brand { font-size: 1.15rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
    .nav-btn {
      background: transparent; color: var(--txt); border: 1px solid rgba(212,175,55,0.45);
      padding: 10px 24px; font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; border-radius: 4px; transition: all 0.3s ease;
    }
    .nav-btn:hover { border-color: var(--gold); color: #fff; box-shadow: 0 0 18px var(--glow), inset 0 0 8px rgba(212,175,55,0.25); }
    .nav-btn:active, .nav-btn.flash { background: var(--gold); color: var(--bg); box-shadow: 0 0 32px #ffd700; }
    main { position: relative; z-index: 5; max-width: 1280px; margin: 0 auto; padding: 60px 6% 100px; }
    .page-header { margin-bottom: 48px; }
    .page-header h1 { font-size: clamp(2rem,4vw,3rem); font-weight: 300; color: var(--gold); margin-bottom: 12px; }
    .page-header p { color: var(--mut); font-size: 1.05rem; max-width: 600px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 36px; }
    .card {
      background: rgba(18,18,24,0.78); border: 1px solid rgba(212,175,55,0.25); border-radius: 8px;
      overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column;
      transition: transform 0.35s, border-color 0.35s, box-shadow 0.35s; backdrop-filter: blur(8px);
    }
    .card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 22px rgba(212,175,55,0.3); }
    .img-wrap { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #111; position: relative; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
    .card:hover .img-wrap img { transform: scale(1.05); }
    .badge {
      position: absolute; top: 14px; right: 14px; background: rgba(7,7,9,0.85);
      border: 1px solid var(--gold); color: var(--gold); font-size: 0.78rem; padding: 4px 10px; border-radius: 4px;
    }
    .body { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
    .artist { font-size: 1.4rem; color: var(--gold); margin-bottom: 6px; font-weight: 500; }
    .title { font-size: 1rem; margin-bottom: 12px; }
    .desc { font-size: 0.92rem; color: var(--mut); line-height: 1.55; margin-bottom: 20px; flex-grow: 1; }
    .foot {
      display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px; font-size: 0.85rem; color: var(--gold); text-transform: uppercase;
    }
    #overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; }
    #overlay.active { display: flex; }
    #video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="wreath-bg"></div>
  <header>
    <div class="brand">Чагарники і Чорнобривці</div>
    <button id="home-btn" class="nav-btn">На головну</button>
  </header>
  <main>
    <div class="page-header">
      <h1>Виставкові зали</h1>
      <p>Цифрові експозиції українського мистецтва. Оберіть залу для перегляду полотен.</p>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <div id="overlay"><video id="video" playsinline preload="auto"><source src="transmit.mp4" type="video/mp4"></video></div>
  <script src="gallery-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('grid');
      if (typeof EXHIBITIONS_DATA !== 'undefined') {
        EXHIBITIONS_DATA.forEach(item => {
          const a = document.createElement('a');
          a.href = item.pageUrl; a.className = 'card';
          a.innerHTML = `
            <div class="img-wrap"><img src="${item.folder}/${item.tileImage}" alt="${item.artist}"><span class="badge">${item.artworksCount} робіт</span></div>
            <div class="body"><h2 class="artist">${item.artist}</h2><div class="title">«${item.title}»</div>
            <p class="desc">${item.description}</p><div class="foot"><span>${item.dates}</span><span>Увійти в залу →</span></div></div>`;
          grid.appendChild(a);
        });
      }
      const btn = document.getElementById('home-btn'), ov = document.getElementById('overlay'), vid = document.getElementById('video');
      btn.addEventListener('click', () => {
        btn.classList.add('flash'); ov.classList.add('active'); vid.playbackRate = 1.0;
        const go = () => window.location.href = 'index.html';
        vid.onended = go; vid.onerror = go; vid.play().catch(go);
      });
    });
  </script>
</body>
</html>
